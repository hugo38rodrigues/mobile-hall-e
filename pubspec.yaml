name: hall_e_mobile
description: A app mobile for hall-e

publish_to: 'none'

version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.3.2
  flutter_dotenv: ^5.0.2
  english_words: ^4.0.0
  provider: ^6.0.0
  shared_preferences: ^2.0.18
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.4
  image_picker: ^1.0.7
  latlong2: ^0.9.0
  flutter_map: ^7.0.0
  flutter_map_marker_popup: ^7.0.0
  flutter_map_tile_caching: ^9.0.0
  geolocator: ^10.1.0
  url_launcher: ^6.1.14
  font_awesome_flutter: ^10.8.0
  pdf: ^3.10.7
  printing: ^5.12.0
  cached_network_image: ^3.4.0
  hex: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.3.4
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500

  assets:
    - assets/icons/calendar_unselected.png
    - assets/icons/calendar_selected.png
    - assets/icons/beer_unselected.png
    - assets/icons/beer_selected.png
    - assets/icons/user_unselected.png
    - assets/icons/user_selected.png
    - assets/fonts/
    - assets/gameLogos/lol.png
    - assets/gameLogos/valorant.png
    - assets/gameLogos/cs.png
    - assets/logo_hall_e.png
    - .env
